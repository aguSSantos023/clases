<main class="min-h-screen bg-background-c mb-10 relative">

  <app-menu-overlay-c #overlay />

  <app-btn-press-c
    #menuBtn
    typeValue="icon"
    iconName="menu"
    [sizeValueSVG]="2"
    [sizeValueIcon]="2"
    [onPressFn]="toggleMenu"
    class="fixed top-3 left-3 z-50"
  />

  <div class="w-full max-w-7xl mx-auto sm:px-6 lg:px-8">

    <app-hero-c
      id="hero"
      (sendColorPress)="getColorPress($event)"
    />

    <app-for-whom-c
      id="forWhom"
      [colorPress]="colorPress()"
    />

    <app-course-c
      id="course"
      [colorPress]="colorPress()"
    />

    <app-teacher-c
      id="teacher"
      [colorPress]="colorPress()"
    />

  </div>
</main>

<footer class="bg-dark-c py-10 text-white text-center font-stack-notch-f">

  <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="mb-8">
      <h2 class="text-3xl font-bold mx-2 mb-2">
        ¿Listo para Aprender de Verdad?
      </h2>

      <p class="max-w-2xl mx-auto">
        No más tutoriales confusos ni teoría sin aplicación.
        Aprende haciendo, entiende cada concepto y construye
        proyectos reales desde el primer día.
      </p>
    </div>

    <app-btn-press-c
      [onPressFn]="goToContact"
      [paddingText]="[30, 8]"
      [color]="colorPress()"
      text="Reservar Clase"
      class="text-2xl"
    />

  </div>
</footer>
