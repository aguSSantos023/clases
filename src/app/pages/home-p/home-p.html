<main
  class="min-h-screen bg-background-c mb-10"
  >

  <app-menu-overlay-c #overlay />

  <app-btn-press-c
    #menuBtn
    typeValue="icon"
    iconName="menu"
    [sizeValueSVG]="2"
    [sizeValueIcon]="2"
    [onPressFn]="toggleMenu"
    class="fixed top-3 left-3 z-50"
  />


  <app-hero-c
    id="hero"
    (sendColorPress)="getColorPress($event)"
  />


  <app-for-whom-c
    id="forWhom"
    [colorPress]="colorPress()"
  />

  <app-course-c
    id="course"
    [colorPress]="colorPress()"
  />


  <app-teacher-c
    id="teacher"
    [colorPress]="colorPress()"
  />

</main>


<footer
  class="bg-dark-c px-5 py-10  text-white text-center font-stack-notch-f"
  >


  <div class="mb-8">
    <h2 class="text-3xl font-bold mx-2 mb-2">
      ¿Listo para Aprender de Verdad?
    </h2>

    <p>
      No más tutoriales confusos ni teoría sin aplicación.
      Aprende haciendo, entiende cada concepto y construye
      proyectos reales desde el primer día.
    </p>
  </div>



  <app-btn-press-c
    [onPressFn]="goToContact"
    [paddingText]="[30, 8]"
    [color]="colorPress()"
    text="Reservar Clase"
    class="text-2xl"
  />

</footer>
