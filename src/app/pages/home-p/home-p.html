<main
  class="min-h-screen bg-background-c"
  >

  <app-menu-overlay-c #overlay />

  <app-btn-press-c
    #menuBtn
    typeValue="icon"
    iconName="menu"
    [sizeValueSVG]="2"
    [sizeValueIcon]="2"
    [onPressFn]="toggleMenu"
    class="fixed top-3 left-3 z-50"
  />


  <app-hero-c
    id="hero"
    (sendColorPress)="getColorPress($event)"
  />


  <app-for-whom-c
    id="forWhom"
    [colorPress]="colorPress()"
  />

  <app-course-c
    id="course"
    [colorPress]="colorPress()"
  />

</main>
